spring.application.name=billing-system

server.port=8081
server.servlet.context-path=/

spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/bloombuddy?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=billing_user
spring.datasource.password=billing_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=BloomBuddyHikariPool

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

logging.level.root=INFO
logging.level.com.billing=DEBUG
